# Same hyperparameters as the authors' notebook. Don't tune these; the point is to match 0.51, not beat it.
data_dir: data
out_dir: outputs/bert_baseline
model_name: bert-base-uncased
max_len: 512
batch_size: 8
lr: 2.0e-5
epochs: 5
threshold: 0.5
seed: 0
save_checkpoint: true
# refuse to train unless the data matches the paper's counts (false only for the public sample)
require_paper_match: true
# leave unset to pick CUDA, then the Apple GPU, then CPU; set to cpu to force a comparison run
device:
